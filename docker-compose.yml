services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bioconnect
      POSTGRES_PASSWORD: bioconnect
      POSTGRES_DB: bioconnect
    ports:
      - "5432:5432"
    volumes:
      - bioconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bioconnect_pgdata:
